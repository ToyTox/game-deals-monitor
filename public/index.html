<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Deals Monitor</title>
  <link rel="stylesheet" href="/styles.css">
  <script>
    // Тема до первой отрисовки: app.js грузится с defer — для этого слишком поздно
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('theme'); } catch (e) {}
      document.documentElement.dataset.theme =
        stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    })();
  </script>
</head>
<body>
  <header>
    <div class="header-content">
      <h1>🎮 Game Deals Monitor</h1>
      <div class="header-controls">
        <div class="health-status">
          <span id="health-dot" class="fail"></span>
          <span id="health-text">Загрузка…</span>
        </div>
        <a class="header-link" href="/admin.html">Админка</a>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Переключить тему" title="Переключить тему"></button>
        <div class="refresh-group">
          <span id="refresh-status" class="refresh-status"></span>
          <button id="refresh-all" type="button" title="Запустить парсинг всех площадок и перечитать данные">
            <span class="spinner" hidden></span>
            <span class="btn-label">Обновить всё</span>
          </button>
        </div>
      </div>
    </div>
    <div id="refresh-progress" class="refresh-progress" hidden>
      <div class="refresh-progress-bar"></div>
    </div>
  </header>

  <main>
    <!-- Statistics Section -->
    <section class="stats-section">
      <h2>Статистика</h2>
      <div id="stats-tiles" class="stats-tiles"></div>
      <div id="stats-platforms" class="stats-platforms"></div>
      <div id="stats-top" class="stats-top"></div>
      <div class="stats-actions">
        <button id="btn-stats">Обновить статистику</button>
        <button id="btn-health">Проверить health</button>
      </div>
    </section>

    <!-- Free Games Section -->
    <section class="catalog-section" id="section-free">
      <div class="section-head">
        <h2>🎁 Бесплатные игры</h2>
        <div class="section-meta" id="free-meta"></div>
      </div>
      <div id="free-filters" class="section-filters"></div>
      <div id="free-state"></div>
      <div id="free-grid" class="grid"></div>
      <nav id="free-pager" class="pager" aria-label="Пагинация: бесплатные игры"></nav>
    </section>

    <!-- Discounts Section -->
    <section class="catalog-section" id="section-deals">
      <div class="section-head">
        <h2>🔥 Скидки</h2>
        <div class="section-meta" id="deals-meta"></div>
      </div>
      <div id="deals-filters" class="section-filters"></div>
      <div id="deals-state"></div>
      <div id="deals-grid" class="grid"></div>
      <nav id="deals-pager" class="pager" aria-label="Пагинация: скидки"></nav>
    </section>

  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/common.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
